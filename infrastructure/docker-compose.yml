# Stack locale minimale pour l'intro RAG : Ollama (LLM + embeddings) + Qdrant (base vectorielle)
services:
  ollama:
    image: ollama/ollama:latest
    container_name: introrag-ollama
    ports: ["11434:11434"]
    volumes: ["ollama_data:/root/.ollama"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
  ollama-init:
    image: ollama/ollama:latest
    container_name: introrag-ollama-init
    depends_on:
      ollama: { condition: service_healthy }
    environment: ["OLLAMA_HOST=http://ollama:11434"]
    entrypoint: ["sh", "-c", "ollama pull gemma3:4b && ollama pull nomic-embed-text"]
    restart: "no"
  qdrant:
    image: qdrant/qdrant:latest
    container_name: introrag-qdrant
    ports: ["6333:6333", "6334:6334"]   # 6333 REST/UI, 6334 gRPC (utilisé par QdrantClient)
    volumes: ["qdrant_data:/qdrant/storage"]
    restart: unless-stopped
volumes:
  ollama_data:
  qdrant_data:
